name: Recover shared gateway

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REBUILD to reinstall the shared gateway once
        required: true
        type: string

concurrency:
  group: shared-gateway
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    if: inputs.confirmation == 'REBUILD'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      GATEWAY_SHARED_SECRET: ${{ secrets.GATEWAY_SHARED_SECRET }}
      CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
      CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
      VULTR_GATEWAY_ID: 9f12d5c5-a788-4dd9-b340-39d8fbbace44
      DRUM_API_ORIGIN: ${{ vars.DRUM_API_ORIGIN }}
      RELAY_PRIVATE_IPV4: 10.42.0.3
      BLOSSOM_PRIVATE_IPV4: 10.42.0.4
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovery configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VULTR_API_KEY
            GATEWAY_SHARED_SECRET
            CLOUDFLARE_ORIGIN_CERT
            CLOUDFLARE_ORIGIN_KEY
            DRUM_API_ORIGIN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing recovery value: $name" >&2
              exit 1
            fi
          done
          umask 077
          trap 'rm -f /tmp/drum-origin.pem /tmp/drum-origin-key.pem' EXIT
          printf '%s' "$CLOUDFLARE_ORIGIN_CERT" > /tmp/drum-origin.pem
          printf '%s' "$CLOUDFLARE_ORIGIN_KEY" > /tmp/drum-origin-key.pem
          openssl x509 -in /tmp/drum-origin.pem -noout
          openssl pkey -in /tmp/drum-origin-key.pem -noout
          openssl x509 -in /tmp/drum-origin.pem -noout -checkhost relay.drum.dev
          openssl x509 -in /tmp/drum-origin.pem -noout -checkhost media.drum.dev
          cert_public_key=$(openssl x509 -in /tmp/drum-origin.pem -pubkey -noout |
            openssl pkey -pubin -outform DER |
            sha256sum | awk '{print $1}')
          private_public_key=$(openssl pkey -in /tmp/drum-origin-key.pem -pubout -outform DER |
            sha256sum | awk '{print $1}')
          if [[ "$cert_public_key" != "$private_public_key" ]]; then
            echo 'Cloudflare Origin certificate and private key do not match' >&2
            exit 1
          fi

      - name: Test and build Debian release binary
        run: |
          docker run --rm \
            --env "DRUM_GATEWAY_BUILD_SHA=$GITHUB_SHA" \
            --volume "$GITHUB_WORKSPACE:/app" \
            --workdir /app \
            rust:1.90-bookworm \
            sh -ceu '
              apt-get update
              apt-get install -y --no-install-recommends cmake
              rustup component add rustfmt
              cargo fmt --check
              cargo check --all-targets --locked
              cargo test --locked
              cargo build --release --locked
            '
          sudo chown "$(id -u):$(id -g)" target/release/drum-gateway

      - name: Publish recovery artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          immutable_tag="gateway-$GITHUB_SHA"
          deployment_tag=gateway-shared
          artifact_sha256=$(sha256sum target/release/drum-gateway | awk '{print $1}')
          install -m 0755 target/release/drum-gateway /tmp/drum-gateway-linux-amd64
          printf '%s  %s\n' "$artifact_sha256" drum-gateway-linux-amd64 \
            > /tmp/drum-gateway-linux-amd64.sha256

          if gh release view "$immutable_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$immutable_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$immutable_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Gateway $GITHUB_SHA" \
              --notes "Automated shared gateway build for commit $GITHUB_SHA." \
              --prerelease
          fi

          if gh release view "$deployment_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$deployment_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$deployment_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Shared gateway deployment' \
              --notes 'Stable deployment assets consumed once when the shared gateway boots.' \
              --prerelease
          fi

          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_ENV"
          echo "artifact_url_b64=$(printf '%s' "https://github.com/$GITHUB_REPOSITORY/releases/download/$immutable_tag/drum-gateway-linux-amd64" | base64 -w 0)" >> "$GITHUB_ENV"

      - name: Build one-time recovery bootstrap
        shell: bash
        run: |
          set -euo pipefail
          api_origin_b64=$(printf '%s' "$DRUM_API_ORIGIN" | base64 -w 0)
          shared_secret_b64=$(printf '%s' "$GATEWAY_SHARED_SECRET" | base64 -w 0)
          origin_cert_b64=$(printf '%s' "$CLOUDFLARE_ORIGIN_CERT" | base64 -w 0)
          origin_key_b64=$(printf '%s' "$CLOUDFLARE_ORIGIN_KEY" | base64 -w 0)
          sed \
            -e "s|__GATEWAY_ARTIFACT_URL_B64__|$artifact_url_b64|g" \
            -e "s|__GATEWAY_ARTIFACT_SHA256__|$artifact_sha256|g" \
            -e "s|__DRUM_API_ORIGIN_B64__|$api_origin_b64|g" \
            -e "s|__GATEWAY_SHARED_SECRET_B64__|$shared_secret_b64|g" \
            -e "s|__CLOUDFLARE_ORIGIN_CERT_B64__|$origin_cert_b64|g" \
            -e "s|__CLOUDFLARE_ORIGIN_KEY_B64__|$origin_key_b64|g" \
            -e "s|__RELAY_PRIVATE_IPV4__|$RELAY_PRIVATE_IPV4|g" \
            -e "s|__BLOSSOM_PRIVATE_IPV4__|$BLOSSOM_PRIVATE_IPV4|g" \
            deploy/cloud-init.sh.tmpl > /tmp/gateway-recovery.sh
          chmod 0600 /tmp/gateway-recovery.sh

      - name: Reinstall gateway once
        shell: bash
        run: |
          set -euo pipefail
          jq -n --rawfile data /tmp/gateway-recovery.sh \
            '{user_data: ($data | @base64)}' |
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --request PATCH \
              "https://api.vultr.com/v2/instances/$VULTR_GATEWAY_ID" \
              --header "Authorization: Bearer $VULTR_API_KEY" \
              --header 'Content-Type: application/json' \
              --data-binary @-
          reinstall_status=$(curl --silent --show-error \
            --output /tmp/vultr-reinstall-response.json \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.vultr.com/v2/instances/$VULTR_GATEWAY_ID/reinstall" \
            --header "Authorization: Bearer $VULTR_API_KEY")
          case "$reinstall_status" in
            2??) ;;
            504)
              echo 'Vultr timed out after accepting the reinstall; continuing to health verification.'
              ;;
            *)
              echo "Vultr reinstall failed with HTTP $reinstall_status" >&2
              exit 1
              ;;
          esac
          rm -f /tmp/vultr-reinstall-response.json

      - name: Verify recovered gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            response=$(curl --max-time 5 --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://relay.drum.dev/health?expected=$GITHUB_SHA" 2>/dev/null || true)
            if jq -e --arg expected "$GITHUB_SHA" \
              '.status == "ok" and .build == $expected' >/dev/null 2>&1 <<<"$response"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Recovered gateway did not become healthy' >&2
          exit 1

      - name: Clear one-time recovery data
        if: always()
        run: |
          printf '%s' '{"user_data":""}' |
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --request PATCH \
              "https://api.vultr.com/v2/instances/$VULTR_GATEWAY_ID" \
              --header "Authorization: Bearer $VULTR_API_KEY" \
              --header 'Content-Type: application/json' \
              --data-binary @-
