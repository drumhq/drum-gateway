name: Deploy shared gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shared-gateway
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      VULTR_GATEWAY_ID: 9f12d5c5-a788-4dd9-b340-39d8fbbace44
    steps:
      - uses: actions/checkout@v4

      - name: Verify required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(VULTR_API_KEY)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing repository Actions value: $name" >&2
              exit 1
            fi
          done

      - name: Test and build Debian release binary
        run: |
          docker run --rm \
            --env "DRUM_GATEWAY_BUILD_SHA=$GITHUB_SHA" \
            --volume "$GITHUB_WORKSPACE:/app" \
            --workdir /app \
            rust:1.90-bookworm \
            sh -ceu '
              apt-get update
              apt-get install -y --no-install-recommends cmake
              rustup component add rustfmt
              cargo fmt --check
              cargo check --all-targets --locked
              cargo test --locked
              cargo build --release --locked
            '
          sudo chown "$(id -u):$(id -g)" target/release/drum-gateway

      - name: Publish immutable GitHub release artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="gateway-$GITHUB_SHA"
          artifact_sha256=$(sha256sum target/release/drum-gateway | awk '{print $1}')
          install -m 0755 target/release/drum-gateway /tmp/drum-gateway-linux-amd64
          printf '%s  %s\n' "$artifact_sha256" drum-gateway-linux-amd64 \
            > /tmp/drum-gateway-linux-amd64.sha256
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$release_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Gateway $GITHUB_SHA" \
              --notes "Automated shared gateway build for commit $GITHUB_SHA." \
              --prerelease
          fi
          artifact_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/drum-gateway-linux-amd64"
          echo "sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish shared deployment artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_tag=gateway-shared
          if gh release view "$deployment_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$deployment_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$deployment_tag" \
              /tmp/drum-gateway-linux-amd64 \
              /tmp/drum-gateway-linux-amd64.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Shared gateway deployment' \
              --notes 'Stable deployment assets consumed once when the shared gateway boots.' \
              --prerelease
          fi

      - name: Reboot gateway into published release
        shell: bash
        run: |
          set -euo pipefail
          reboot_status=$(curl --silent --show-error \
            --output /tmp/vultr-reboot-response.json \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.vultr.com/v2/instances/$VULTR_GATEWAY_ID/reboot" \
            --header "Authorization: Bearer $VULTR_API_KEY")
          case "$reboot_status" in
            2??) ;;
            504)
              echo 'Vultr timed out after accepting the reboot; continuing to health verification.'
              ;;
            *)
              echo "Vultr reboot failed with HTTP $reboot_status" >&2
              exit 1
              ;;
          esac
          rm -f /tmp/vultr-reboot-response.json

      - name: Verify public gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            response=$(curl --max-time 5 --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://relay.drum.dev/health?expected=$GITHUB_SHA" 2>/dev/null || true)
            if jq -e --arg expected "$GITHUB_SHA" \
              '.status == "ok" and .build == $expected' >/dev/null 2>&1 <<<"$response"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Gateway did not become healthy' >&2
          exit 1
